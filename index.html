<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- 內容安全政策：只能載入自己網站的程式，只能連到 LINE 和 GAS；不允許內嵌程式碼 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://*.line.me https://*.line-scdn.net; frame-src https://*.line.me; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>密碼庫</title>
  <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
  <main id="app">
    <!-- 載入中 -->
    <section id="screen-loading" class="screen center">
      <div class="spinner"></div>
      <p id="loading-text">正在確認身分…</p>
    </section>

    <!-- 錯誤、沒有權限、緊急鎖定 -->
    <section id="screen-message" class="screen center" hidden>
      <div class="big-icon" id="message-icon">🚫</div>
      <h2 id="message-title"></h2>
      <p id="message-text" class="muted pre"></p>
      <button id="message-retry" class="btn btn-outline blue narrow" type="button" hidden>重新整理</button>
      <button id="message-relogin" class="btn btn-outline blue narrow" type="button" hidden>重新登入 LINE</button>
    </section>

    <!-- 解鎖 -->
    <section id="screen-unlock" class="screen" hidden>
      <div class="card">
        <h1>🔐 密碼庫</h1>
        <form id="unlock-form" autocomplete="off">
          <div class="float"><input id="unlock-pw" type="password" autocomplete="current-password" placeholder=" "><label for="unlock-pw">登入密碼</label></div>
          <p id="unlock-hint" class="hint-box" hidden></p>
          <p id="unlock-error" class="error" hidden></p>
          <button id="unlock-submit" class="btn btn-primary" type="submit">解鎖</button>
        </form>
      </div>
    </section>

    <!-- 清單 -->
    <section id="screen-list" class="screen screen-list" hidden>
      <header class="topbar">
        <h1>🔐 密碼庫</h1>
        <div class="topbar-actions">
          <button id="btn-add" class="add-btn" type="button">＋ 新增項目</button>
        </div>
      </header>
      <div class="searchbar">
        <div class="search-wrap">
          <input id="search" type="search" placeholder="🔍 搜尋帳號..." autocomplete="off">
          <button id="search-clear" class="search-clear" type="button" aria-label="清除搜尋" hidden>✕</button>
        </div>
        <div id="owner-wrap" class="select-wrap">
          <select id="filter-owner" aria-label="篩選擁有人">
            <option value="">👤 所有人</option>
          </select>
        </div>
      </div>
      <nav id="chips" class="chips"></nav>
      <nav id="owner-chips" class="chips" hidden></nav>
      <div id="list" class="list"></div>
    </section>
  </main>

  <!-- 詳細資料（點開才下載並解密帳號密碼） -->
  <div id="sheet-detail" class="sheet" hidden>
    <div class="sheet-body">
      <div class="sheet-head">
        <div class="sheet-head-left">
          <button id="d-fav" class="fav-btn" type="button" aria-label="加入常用">☆</button>
          <h2 id="d-name"></h2>
        </div>
        <button class="icon-btn" data-close type="button" aria-label="關閉">✕</button>
      </div>
      <p id="d-cat" class="muted"></p>
      <div class="kv">
        <div class="kv-label">帳號</div>
        <div class="kv-value"><span id="d-user" class="mono">解密中…</span>
          <button id="d-copy-user" class="mini" type="button">📋</button></div>
      </div>
      <div class="kv">
        <div class="kv-label">密碼</div>
        <div class="kv-value"><span id="d-pass" class="mono">••••••••</span>
          <button id="d-reveal" class="mini" type="button">👁️</button>
          <button id="d-copy-pass" class="mini" type="button">📋</button></div>
      </div>
      <div class="kv" id="d-url-row">
        <div class="kv-label">網址</div>
        <div class="kv-value"><a id="d-url" href="#" rel="noopener noreferrer"></a></div>
      </div>
      <div class="kv" id="d-note-row">
        <div class="kv-label">備註</div>
        <div class="kv-value"><span id="d-note" class="pre"></span></div>
      </div>
      <div class="kv" id="d-owner-row">
        <div class="kv-label">擁有人</div>
        <div class="kv-value"><span id="d-owner"></span></div>
      </div>
      <p id="d-meta" class="hint"></p>
      <div class="row">
        <button id="d-edit" class="btn btn-outline green" type="button">✏️ 修改</button>
        <button id="d-delete" class="btn btn-outline red" type="button">🗑️ 刪除</button>
      </div>
    </div>
  </div>

  <!-- 新增、修改 -->
  <div id="sheet-edit" class="sheet" hidden>
    <div class="sheet-body">
      <div class="sheet-head">
        <div class="sheet-title-row">
          <h2 id="e-title">＋ 新增項目</h2>
          <span id="e-name-warn" class="head-warn" hidden>請輸入項目名稱</span>
        </div>
        <button class="icon-btn" data-close type="button" aria-label="關閉">✕</button>
      </div>
      <div class="float"><input id="e-name" type="text" maxlength="60" placeholder=" "><label for="e-name">項目名稱（必填）</label></div>
      <div class="float fixed"><select id="e-owner"></select><label for="e-owner">擁有人</label></div>
      <div class="row">
        <div class="float fixed"><select id="e-cat"></select><label for="e-cat">分類</label></div>
        <div class="float"><input id="e-sub" type="text" maxlength="30" list="e-sub-list" placeholder=" "><label for="e-sub">標籤</label></div>
        <datalist id="e-sub-list"></datalist>
      </div>
      <div class="float"><input id="e-user" type="text" autocomplete="off" placeholder=" "><label for="e-user">帳號 <span class="label-note">（儲存會做加密）</span></label></div>
      <div class="float has-btn"><input id="e-pass" type="password" autocomplete="off" placeholder=" "><label for="e-pass">密碼 <span class="label-note">（儲存會做加密）</span></label>
        <button id="e-pass-toggle" class="mini" type="button" aria-label="顯示密碼">👁️</button></div>
      <div class="float"><input id="e-url" type="url" maxlength="300" placeholder=" "><label for="e-url">網址</label></div>
      <div class="float"><textarea id="e-note" rows="3" maxlength="1000" placeholder=" "></textarea><label for="e-note">備註</label></div>
      <p class="hint">⚠️ 只有帳號、密碼會加密；項目名稱、網址、備註直接存在試算表，請不要寫密碼或安全提問的答案。</p>
      <p id="e-error" class="error" hidden></p>
      <button id="e-save" class="btn btn-primary" type="button">儲存</button>
    </div>
  </div>

  <!-- 對話框 (取代系統 alert / confirm) -->
  <div id="dlg-overlay" class="dlg-overlay" hidden>
    <div class="dlg-card">
      <div id="dlg-title" class="dlg-title">確認</div>
      <div id="dlg-msg" class="dlg-msg"></div>
      <div class="dlg-actions">
        <button id="dlg-cancel" class="btn btn-outline" type="button">取消</button>
        <button id="dlg-ok" class="btn btn-primary" type="button">確定</button>
      </div>
    </div>
  </div>

  <!-- 全螢幕遮罩 Loading -->
  <div id="load-mask" class="load-mask" hidden>
    <div class="load-mask-card">
      <div class="spinner"></div>
      <div id="load-mask-text" class="load-mask-text">處理中…</div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="config.js"></script>
  <script src="vault-crypto.js"></script>
  <script src="vendor/liff-sdk-2.31.0.js" integrity="sha384-T6WhT96rkehAFkTtmiRZ60sehxj4zgbifvzi7oGH792T3NN++f2rCvyb/WrHAz2D"></script>
  <script src="app.js?v=12"></script>
</body>
</html>

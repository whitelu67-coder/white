<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- 內容安全政策：只能載入自己網站的程式，只能連到 LINE 和 GAS；不允許內嵌程式碼 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://*.line.me https://*.line-scdn.net; frame-src https://*.line.me; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>密碼本</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <!-- 載入中 -->
    <section id="screen-loading" class="screen center">
      <div class="spinner"></div>
      <p id="loading-text">正在確認身分…</p>
    </section>

    <!-- 錯誤、沒有權限、緊急鎖定 -->
    <section id="screen-message" class="screen center" hidden>
      <div class="big-icon" id="message-icon">🚫</div>
      <h2 id="message-title"></h2>
      <p id="message-text" class="muted pre"></p>
      <button id="message-retry" class="btn btn-outline blue narrow" type="button" hidden>重新整理</button>
      <button id="message-relogin" class="btn btn-outline blue narrow" type="button" hidden>重新登入 LINE</button>
    </section>

    <!-- 解鎖 -->
    <section id="screen-unlock" class="screen" hidden>
      <div class="card">
        <h1>🔐 密碼本</h1>
        <p class="muted">請輸入主密碼</p>
        <form id="unlock-form" autocomplete="off">
          <label class="field">主密碼
            <input id="unlock-pw" type="password" autocomplete="current-password">
          </label>
          <button id="unlock-hint-btn" class="link-btn" type="button" hidden>💡 顯示提示</button>
          <p id="unlock-hint" class="hint-box" hidden></p>
          <p id="unlock-error" class="error" hidden></p>
          <button id="unlock-submit" class="btn btn-primary" type="submit">解鎖</button>
        </form>
      </div>
    </section>

    <!-- 清單 -->
    <section id="screen-list" class="screen screen-list" hidden>
      <header class="topbar">
        <h1>🔐 密碼本</h1>
        <div class="topbar-actions">
          <button id="btn-lock" class="icon-btn" type="button" aria-label="立即鎖定">🔒</button>
        </div>
      </header>
      <div class="searchbar">
        <input id="search" type="search" placeholder="🔍 搜尋（例如：台新）" autocomplete="off">
      </div>
      <nav id="chips" class="chips"></nav>
      <div id="list" class="list"></div>
      <button id="btn-add" class="fab" type="button">＋ 新增</button>
    </section>
  </main>

  <!-- 詳細資料（點開才下載並解密帳號密碼） -->
  <div id="sheet-detail" class="sheet" hidden>
    <div class="sheet-body">
      <div class="sheet-head">
        <h2 id="d-name"></h2>
        <button class="icon-btn" data-close type="button" aria-label="關閉">✕</button>
      </div>
      <p id="d-cat" class="muted"></p>
      <div class="kv">
        <div class="kv-label">帳號</div>
        <div class="kv-value"><span id="d-user" class="mono">解密中…</span>
          <button id="d-copy-user" class="mini" type="button">📋</button></div>
      </div>
      <div class="kv">
        <div class="kv-label">密碼</div>
        <div class="kv-value"><span id="d-pass" class="mono">••••••••</span>
          <button id="d-reveal" class="mini" type="button">👁️</button>
          <button id="d-copy-pass" class="mini" type="button">📋</button></div>
      </div>
      <div class="kv" id="d-url-row">
        <div class="kv-label">網址</div>
        <div class="kv-value"><a id="d-url" href="#" rel="noopener noreferrer"></a></div>
      </div>
      <div class="kv" id="d-note-row">
        <div class="kv-label">備註</div>
        <div class="kv-value"><span id="d-note" class="pre"></span></div>
      </div>
      <p id="d-meta" class="hint"></p>
      <div class="row">
        <button id="d-edit" class="btn btn-outline green" type="button">✏️ 修改</button>
        <button id="d-delete" class="btn btn-outline red" type="button">🗑️ 刪除</button>
      </div>
    </div>
  </div>

  <!-- 新增、修改 -->
  <div id="sheet-edit" class="sheet" hidden>
    <div class="sheet-body">
      <div class="sheet-head">
        <h2 id="e-title">新增</h2>
        <button class="icon-btn" data-close type="button" aria-label="關閉">✕</button>
      </div>
      <label class="field">名稱 *<input id="e-name" type="text" maxlength="60" placeholder="例如：台新 Richart"></label>
      <div class="row">
        <label class="field">分類<select id="e-cat"></select></label>
        <label class="field">小分類<input id="e-sub" type="text" maxlength="30" list="e-sub-list" placeholder="例如：台新"></label>
        <datalist id="e-sub-list"></datalist>
      </div>
      <label class="field">帳號<input id="e-user" type="text" maxlength="200" autocomplete="off"></label>
      <label class="field">密碼
        <div class="input-group">
          <input id="e-pass" type="password" maxlength="200" autocomplete="new-password">
          <button id="e-pass-toggle" class="mini" type="button">👁️</button>
          <button id="e-gen" class="mini" type="button">🎲</button>
        </div>
      </label>
      <div class="gen-opts">
        <label>長度 <input id="e-gen-len" type="number" min="8" max="64" value="16"></label>
        <label class="check"><input id="e-gen-sym" type="checkbox" checked> 包含符號</label>
      </div>
      <label class="field">網址<input id="e-url" type="url" maxlength="300" placeholder="https://"></label>
      <label class="field">備註<textarea id="e-note" rows="3" maxlength="1000"></textarea></label>
      <p class="hint">⚠️ 網址和備註會跟名稱一起顯示在清單上，請不要寫密碼或安全提問的答案。</p>
      <p id="e-error" class="error" hidden></p>
      <button id="e-save" class="btn btn-primary" type="button">儲存</button>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="config.js"></script>
  <script src="vault-crypto.js"></script>
  <script src="vendor/liff-sdk-2.31.0.js" integrity="sha384-T6WhT96rkehAFkTtmiRZ60sehxj4zgbifvzi7oGH792T3NN++f2rCvyb/WrHAz2D"></script>
  <script src="app.js"></script>
</body>
</html>
